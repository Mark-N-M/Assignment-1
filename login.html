<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Page</title>

    <link rel="stylesheet" href="index.css">

    <body>

      <form action="/submit-login" method="POST" class="login-form" style="background-color:#D3D3D3; border-radius:10px;">
      
        <div class="header-p">
        <h1>Welcome Back</h1> 
        <p>Sign in to your account</p>
      </div>
      
      <div class="email-1">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required placeholder="Enter your email" title="Please enter a valid email address">
      </div>

      <div class="password-1">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required placeholder="Enter your password" title="Please enter a valid password">
      </div>

        <button type="submit" class="button-1">Login</button>

        <p>Don't Have An Account?<a href="#">Sign up</a></p> 

    </form>

    </body>

    </html>
